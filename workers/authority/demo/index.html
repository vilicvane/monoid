<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Monoid Authority · 登录 Demo</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">MONOID / LOCAL DEMO</p>
        <h1>Authority</h1>
        <p>登录身份，管理命名空间，验证时间证明。</p>
      </header>
      <section>
        <div class="section-title">
          <h2>登录</h2>
          <span id="connection" class="badge">未登录</span>
        </div>
        <p id="account">使用 AppKit 选择钱包、邮箱或社交账号。</p>
        <div class="actions">
          <button id="login">使用 AppKit 登录</button>
          <button id="refresh" class="secondary">同步登录状态</button>
          <button id="logout" class="secondary" disabled>退出登录</button>
        </div>
        <p id="status" role="status" aria-live="polite">正在初始化…</p>
      </section>
      <section>
        <div class="section-title">
          <h2>一级组</h2>
          <button id="github" class="secondary" disabled>连接 GitHub</button>
        </div>
        <p>显示名称可以修改，永久 ID 保持不变。</p>
        <div id="namespaces"><p class="empty">登录后显示可管理的身份。</p></div>
      </section>
      <section>
        <h2>时间证明</h2>
        <p>生成随机 challenge，向本地 Authority 请求证明并验证签名。</p>
        <button id="time" class="secondary">请求并验签</button>
        <p id="time-status" role="status" aria-live="polite"></p>
      </section>
      <footer>
        本地开发环境 · <span id="endpoint"></span><br />不会执行交易或写入 Java
        Card。
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
